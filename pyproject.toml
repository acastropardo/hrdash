[project]
name = "hrdash"
version = "0.1.0"
description = "Dashboard de frecuencia cardiaca en terminal (BLE, macOS/Linux)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "textual>=1.0",
    "garmin-fit-sdk>=0.6.10",
]

[project.optional-dependencies]
gl = ["moderngl>=5.10", "glfw>=2.6", "numpy>=1.26"]

[project.scripts]
hrdash = "hrdash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hrdash"]
